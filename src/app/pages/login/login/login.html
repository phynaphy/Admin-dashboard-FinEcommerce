<p-toast />
<div class="min-h-screen bg-cover bg-center flex items-center justify-center p-4 sm:p-6"
     [style.backgroundImage]="'url(' + backgroundImage + ')'">
    <!-- Glassmorphism Container Card -->
    <div class="w-full max-w-md p-8 sm:p-10 bg-white/២៥ dark:bg-slate-900/70 backdrop-blur-xl border border-white/40 dark:border-slate-700/50 rounded-3xl shadow-2xl flex flex-col items-center gap-8 transition-all">

        <!-- Header Section -->
        <div class="flex flex-col items-center text-center">
            <div class="w-16 h-16 rounded-2xl bg-emerald-500/10 flex items-center justify-center mb-3 border border-emerald-500/20 shadow-inner">
                <i class="pi pi-lock text-emerald-600 dark:text-emerald-400 !text-3xl"></i>
            </div>
            <h1 class="text-4xl font-bold text-white dark:text-white tracking-tight">Welcome Back</h1>
        </div>

        <!-- Login Form -->
        <form class="w-full flex flex-col gap-5" (ngSubmit)="onLogin()" #loginForm="ngForm">

            <!-- Username Field -->
            <div class="w-full flex flex-col gap-1.5">
                <label for="username" class="text-xs tracking-wider text-white dark:text-slate-300">
                    Username or Email
                </label>

                <p-iconfield iconPosition="left" class="w-full">
                    <p-inputicon class="pi pi-user text-slate-400"></p-inputicon>
                    <input
                        pInputText
                        id="username"
                        placeholder="Enter your username"
                        type="text"
                        class="w-full text-sm bg-slate-50/80 dark:bg-slate-800/80 border border-slate-300/80 dark:border-slate-700 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 rounded-xl py-2.5 pl-10 pr-3 transition-all text-slate-800 dark:text-slate-100 placeholder:text-slate-400"
                        [(ngModel)]="credentials.username"
                        name="username"
                        #usernameVar="ngModel"
                        required
                    />
                </p-iconfield>

                <div class="min-h-[20px] flex items-center px-1">
                    @if (usernameVar.invalid && (usernameVar.dirty || usernameVar.touched)) {
                        <small class="text-red-500 text-xs font-medium flex items-center gap-1">
                            <i class="pi pi-exclamation-circle text-xs"></i>
                            Username is required
                        </small>
                    }
                </div>
            </div>

            <!-- Password Field -->
            <div class="w-full flex flex-col gap-1.5">
                <div class="flex items-center justify-between">
                    <label for="password" class="text-xs font-semibold tracking-wider text-white dark:text-slate-300">
                        Password
                    </label>
                    <a href="/auth/forgot-password" class="text-xs font-semibold text-emerald-600 hover:text-emerald-700 dark:text-emerald-400 transition-colors">
                        Forgot?
                    </a>
                </div>

                <p-password
                    id="password"
                    placeholder="••••••••"
                    [(ngModel)]="credentials.password"
                    name="password"
                    #passwordVar="ngModel"
                    [toggleMask]="true"
                    [feedback]="false"
                    styleClass="w-full"
                    inputStyleClass="w-full text-sm bg-slate-50/80 dark:bg-slate-800/80 border border-slate-300/80 dark:border-slate-700 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 rounded-xl py-2.5 px-3 transition-all text-slate-800 dark:text-slate-100 placeholder:text-slate-400"
                    required>
                </p-password>

                <div class="min-h-[20px] flex items-center px-1">
                    @if (passwordVar.invalid && (passwordVar.dirty || passwordVar.touched)) {
                        <small class="text-red-500 text-xs font-medium flex items-center gap-1">
                            <i class="pi pi-exclamation-circle text-xs"></i>
                            Password is required
                        </small>
                    }
                </div>
            </div>

            <!-- Submit Button -->
            <div class="w-full pt-2">
                <p-button
                    [loading]="isLoading()"
                    [disabled]="loginForm.invalid"
                    type="submit"
                    label="Sign In"
                    size="large"
                    styleClass="w-full !bg-blue hover:!bg-emerald-700 !border-emerald-600 !rounded-xl !py-3 !font-semibold !shadow-lg !shadow-emerald-600/25 transition-all">
                </p-button>
            </div>

        </form>
    </div>
</div>
